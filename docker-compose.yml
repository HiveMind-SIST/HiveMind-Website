name: hivemind

services:

  server:
    build:
      context: ./server
      dockerfile: Dockerfile

    container_name: hivemind-server

    restart: unless-stopped

    env_file:
      - ./server/.env

    environment:
      NODE_ENV: production
      PORT: 5000

    expose:
      - "5000"

    healthcheck:
      test: ["CMD-SHELL","wget --spider -q http://127.0.0.1:5000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"


    networks:
      - hivemind-network


  client:

    build:
      context: ./client
      dockerfile: Dockerfile

      args:
        VITE_API_BASE_URL: /api
        VITE_CLOUDINARY_CLOUD_NAME: ${VITE_CLOUDINARY_CLOUD_NAME}
        VITE_CLOUDINARY_UPLOAD_PRESET: ${VITE_CLOUDINARY_UPLOAD_PRESET}

    container_name: hivemind-client

    depends_on:
      server:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL","wget --spider -q http://127.0.0.1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    restart: unless-stopped

    networks:
      - hivemind-network


  nginx:

    image: nginx:1.25-alpine

    container_name: hivemind-nginx

    depends_on:
      server:
        condition: service_healthy

      client:
        condition: service_healthy

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    restart: unless-stopped

    networks:
      - hivemind-network

networks:
  hivemind-network:
    driver: bridge