# =====================================================
# HiveMind Production Nginx Reverse Proxy
# =====================================================

# ----------------------------
# HTTP
# ----------------------------
server {
    listen 80;
    listen [::]:80;

    server_name hivemindsist.dev www.hivemindsist.dev;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ----------------------------
# HTTPS
# ----------------------------
server {

    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name hivemindsist.dev www.hivemindsist.dev;

    ssl_certificate     /etc/letsencrypt/live/hivemindsist.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hivemindsist.dev/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    client_max_body_size 50M;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;

    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    proxy_http_version 1.1;

    # ----------------------------
    # Backend API
    # ----------------------------
    location /api/ {

        proxy_pass http://server:5000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
        proxy_connect_timeout 90s;
    }

    # ----------------------------
    # Health Check
    # ----------------------------
    location /health {
        proxy_pass http://server:5000/health;
    }

    # ----------------------------
    # React Frontend
    # ----------------------------
    location / {

        proxy_pass http://client:80;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}